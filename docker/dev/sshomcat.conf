# Dev vhost for docker-compose.dev.yml. Adapted from ../../proxy/sshomcat.conf.example --
# self-signed cert, and proxies to the "backend" service by its compose network name instead of
# 127.0.0.1 (Apache and Tomcat are separate containers here, not colocated on one host).

# The stock httpd.conf only Listens on 80 by default (443 normally comes from the
# httpd-ssl.conf we're deliberately not using) -- so this vhost's <VirtualHost *:443> needs an
# explicit Listen or Apache never binds the port at all.
Listen 443

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile      /usr/local/apache2/certs/sshomcat.crt
    SSLCertificateKeyFile   /usr/local/apache2/certs/sshomcat.key

    DocumentRoot /usr/local/apache2/htdocs
    <Directory /usr/local/apache2/htdocs>
        Require all granted
    </Directory>

    ProxyPass        "/api/" "http://backend:8080/api/"
    ProxyPassReverse "/api/" "http://backend:8080/api/"

    # See docs/architecture.md/api.md: long-lived interactive sessions need a proxy timeout
    # longer than mod_proxy's default, or idle terminals get dropped by Apache itself.
    ProxyTimeout 660

    ProxyPass        "/ws/" "ws://backend:8080/ws/"
    ProxyPassReverse "/ws/" "ws://backend:8080/ws/"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
